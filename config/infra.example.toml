# Committed non-secret template. Bootstrap copies this file to
# ~/.config/wavcse-infra/config.toml once and never overwrites that user file.
# Keep credentials and tokens out of TOML; see .env.example for environment variables.

[aws]
region = "us-east-1"

[controller]
expect_omp = true
github_url = "https://github.com"
# mlflow_url = "https://dagshub.com/<owner>/<repository>.mlflow"

[paths]
wavcse = "~/projects/wavCSE"

[runpod]
api_url = "https://api.runpod.io/v2"
graphql_url = "https://api.runpod.io/graphql"
api_key_parameter = "/wavcse-infra/runpod/api-key"
request_timeout_seconds = 10.0
max_read_attempts = 3
retry_backoff_seconds = 0.5
lifecycle_timeout_seconds = 300.0
poll_interval_seconds = 2.0
max_poll_interval_seconds = 10.0
create_reconcile_attempts = 3

[storage]
bucket = "CHANGE_ME"
prefix = "wavcse"
presign_expiry_seconds = 3600

[volumes]
# Where a Pod mounts a RunPod network volume. The mount is also the worker's rebuildable
# artifact cache root; canonical artifacts stay in S3.
mount_path = "/workspace/cache"

[jobs]
# Worker-side isolated job workspace; each job gets <worker_root>/<job-id>/.
worker_root = "/workspace/wavcse-jobs"
# Where the reviewed worker-side job runner is installed on a bootstrapped worker.
runner_path = "/root/.local/state/wavcse-worker/job_runner.py"
# Bounded default execution timeout when a job spec omits runtime.timeout_seconds.
default_timeout_seconds = 86400
# Bounded local log copy captured when a job is finalized.
log_tail_bytes = 262144

[ssh]
private_key = "~/.ssh/wavcse_worker"
known_hosts_file = "~/.local/state/wavcse-infra/known_hosts"
connect_timeout_seconds = 10.0
command_timeout_seconds = 300.0
bootstrap_timeout_seconds = 900.0
transfer_timeout_seconds = 3600.0
readiness_timeout_seconds = 180.0
poll_interval_seconds = 2.0
max_poll_interval_seconds = 10.0
