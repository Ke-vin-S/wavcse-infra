# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g mouse on

# The review UI (lazygit) renders colours through the outer terminal, so tmux must be told
# that terminal is RGB-capable; otherwise colours degrade to a 256-colour approximation.
# default-terminal is what programs inside tmux are told they are running on. Replace '*'
# with the local terminal's own name if it is genuinely not truecolor.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# tmux waits this long before deciding whether an Esc starts a key sequence. The 500 ms
# default makes Esc, which the review UI uses for "go back", feel stuck.
set -s escape-time 10

